<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rulost</title>
    
    <!-- MapLibre GL JS (High Performance WebGL Graphics Engine) -->
    <script src="https://unpkg.com/maplibre-gl@4.5.0/dist/maplibre-gl.js"></script>
    <link href="https://unpkg.com/maplibre-gl@4.5.0/dist/maplibre-gl.css" rel="stylesheet" />
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Courier New', monospace;
            background: #0d0d0d;
            overflow: hidden;
            height: 100vh;
            color: #fff;
        }
        
        #map {
            width: 100vw;
            height: 100vh;
            background: #0d0d0d;
        }

        /* 
           FIXED SCREEN HUD MARKER:
           Locks directly into the center of the screen pointing straight up.
           The WebGL map engine turns the world around it instantly.
        */
        .center-indicator {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 9999; 
            pointer-events: none; 
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
        }
        .minecraft-arrow {
            width: 0;
            height: 0;
            border-left: 11px solid transparent;
            border-right: 11px solid transparent;
            border-bottom: 28px solid #00ffcc;
            filter: drop-shadow(0px 0px 8px rgba(0, 255, 204, 0.9));
        }
        
        /* Minimal Raw Data HUD Header */
        .hud-header {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1999;
            background: rgba(10, 15, 26, 0.9);
            border: 1px solid #00ffcc;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.2);
            padding: 12px 20px;
            border-radius: 8px;
            pointer-events: none;
            backdrop-filter: blur(6px);
            width: 85%;
            max-width: 400px;
            transition: opacity 0.3s ease;
        }
        .status-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 4px;
            font-size: 11px;
            letter-spacing: 1px;
        }
        .hud-line {
            display: flex;
            justify-content: space-between;
        }
        .latlng { color: #7fff7f; font-weight: bold; }
        .accuracy { color: #ffaa44; }
        .bearing { color: #00ffcc; }

        /* Sidebar Menu Drawer */
        .sidebar {
            position: fixed;
            top: 0;
            left: -280px; 
            width: 280px;
            height: 100vh;
            background: rgba(10, 15, 26, 0.95);
            border-right: 1px solid #00ffcc;
            z-index: 2000;
            transition: left 0.3s cubic-bezier(0.1, 0.9, 0.2, 1);
            padding: 80px 20px 20px 20px;
            box-shadow: 5px 0 25px rgba(0,0,0,0.5);
            backdrop-filter: blur(8px);
        }
        .sidebar.open {
            left: 0;
        }
        .sidebar-title {
            font-size: 14px;
            color: #00ffcc;
            font-weight: bold;
            border-bottom: 1px solid rgba(0, 255, 204, 0.3);
            padding-bottom: 8px;
            margin-bottom: 20px;
            letter-spacing: 2px;
        }
        
        .menu-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .menu-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(0, 255, 204, 0.4);
            color: #fff;
            padding: 12px;
            font-family: monospace;
            font-size: 12px;
            text-align: left;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .menu-btn.active {
            border-color: #00ffcc;
            background: rgba(0, 255, 204, 0.1);
            color: #00ffcc;
        }
        .status-dot {
            width: 8px;
            height: 8px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
        }
        .menu-btn.active .status-dot {
            background: #00ffcc;
            box-shadow: 0 0 8px #00ffcc;
        }

        /* Hamburger Drawer Icon */
        .sidebar-trigger {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 2100;
            background: rgba(10, 15, 26, 0.9);
            border: 1px solid #00ffcc;
            color: #00ffcc;
            width: 42px;
            height: 42px;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 5px;
            box-shadow: 0 0 10px rgba(0, 255, 204, 0.2);
        }
        .bar {
            width: 20px;
            height: 2px;
            background-color: #00ffcc;
            transition: 0.3s;
        }
        .open .bar:nth-child(1) { transform: rotate(-45deg) translate(-5px, 5px); }
        .open .bar:nth-child(2) { opacity: 0; }
        .open .bar:nth-child(3) { transform: rotate(45deg) translate(-5px, -5px); }
    </style>
</head>
<body>

    <button class="sidebar-trigger" id="menu-btn" onclick="toggleSidebar()">
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
    </button>

    <div class="sidebar" id="sidebar-panel">
        <div class="sidebar-title">SYSTEM MODES</div>
        <div class="menu-group">
            <button class="menu-btn active" id="opt-hud" onclick="toggleOption('hud')">
                <span>SHOW RULOST HUD</span><div class="status-dot"></div>
            </button>
            <button class="menu-btn active" id="opt-trail" onclick="toggleOption('trail')">
                <span>SHOW TRAILS</span><div class="status-dot"></div>
            </button>
        </div>
    </div>

    <div class="hud-header" id="data-hud">
        <div class="status-grid">
            <div class="hud-line"><span>POS:</span> <span class="latlng" id="coords">SEARCHING...</span></div>
            <div class="hud-line"><span>SIG:</span> <span class="accuracy" id="accuracy">--</span></div>
            <div class="hud-line"><span>HDG:</span> <span class="bearing" id="bearing">000° N</span></div>
        </div>
    </div>

    <!-- FIXED MINECRAFT HUD ARROW (Always looks straight forward) -->
    <div class="center-indicator">
        <div class="minecraft-arrow"></div>
    </div>

    <div id="map"></div>

    <script>
        // ============================================================
        // MAPLIBRE GL GRAPHICS ENGINE SETUP
        // ============================================================
        const map = new maplibregl.Map({
            container: 'map',
            dragRotate: false, // Prevent finger twisting from breaking orientation
            pitchWithRotate: false,
            style: {
                'version': 8,
                'sources': {
                    'tactical-tiles': {
                        'type': 'raster',
                        'tiles': ['https://basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png'],
                        'tileSize': 256,
                        'attribution': '&copy; CARTO'
                    }
                },
                'layers': [
                    {
                        'id': 'base-layer',
                        'type': 'raster',
                        'source': 'tactical-tiles'
                    }
                ]
            },
            center: [0, 0],
            zoom: 2
        });

        // ============================================================
        // STATE DATA
        // ============================================================
        let isFirstLocation = true;
        let currentHeading = 0;
        let lastHeadingApplied = -1;
        
        let flagShowHUD = true;
        let flagShowTrail = true;
        
        let pathCoordinates = [];
        let savedWaypoints = [];
        try {
            savedWaypoints = JSON.parse(localStorage.getItem('nav_waypoints')) || [];
        } catch(e) { console.error(e); }

        const coordsEl = document.getElementById('coords');
        const accuracyEl = document.getElementById('accuracy');
        const bearingEl = document.getElementById('bearing');

        // Wait for WebGL context to stabilize before appending vectors
        map.on('load', () => {
            // Setup Trail System Source
            map.addSource('trail-source', {
                'type': 'geojson',
                'data': {
                    'type': 'Feature',
                    'properties': {},
                    'geometry': {
                        'type': 'LineString',
                        'coordinates': []
                    }
                }
            });

            // Draw Trail Layer via GPU Pipeline
            map.addLayer({
                'id': 'trail-layer',
                'type': 'line',
                'source': 'trail-source',
                'layout': {
                    'line-join': 'round',
                    'line-cap': 'round'
                },
                'paint': {
                    'line-color': '#00ffcc',
                    'line-width': 4,
                    'line-dasharray': [2, 3],
                    'line-opacity': 0.7
                }
            });

            // Initialize saved waypoints
            savedWaypoints.forEach(wp => drawWaypointNode(wp.id, wp.lng, wp.lat));
        });

        // ============================================================
        // TRACKING & VELOCITY CAMERA LOCK PIPELINE
        // ============================================================
        function updateLocation(lat, lng, accuracy = null) {
            coordsEl.textContent = `${lat.toFixed(5)}, ${lng.toFixed(5)}`;
            if (accuracy !== null) {
                accuracyEl.textContent = `±${Math.round(accuracy)}m`;
            }

            // Downsample path computations (5-meter thresholds)
            let appendNode = false;
            if (pathCoordinates.length === 0) {
                appendNode = true;
            } else {
                const lastPoint = pathCoordinates[pathCoordinates.length - 1];
                // Quick flat-plane distance check to drop processing overhead
                const dx = lng - lastPoint[0];
                const dy = lat - lastPoint[1];
                if (Math.sqrt(dx*dx + dy*dy) > 0.00005) { // Roughly 5 meters
                    appendNode = true;
                }
            }

            if (appendNode) {
                pathCoordinates.push([lng, lat]); // GeoJSON expects [lng, lat]
                updateTrailRenderPipeline();
            }

            // NATIVE WEBGL CAMERA POSITION LOCK (Slides map smoothly based on your real-world speed)
            map.setCenter([lng, lat]);

            if (isFirstLocation) {
                map.setZoom(17);
                isFirstLocation = false;
            }
        }

        function updateTrailRenderPipeline() {
            if (!map.getSource('trail-source')) return;
            map.getSource('trail-source').setData({
                'type': 'Feature',
                'properties': {},
                'geometry': {
                    'type': 'LineString',
                    'coordinates': flagShowTrail ? pathCoordinates : []
                }
            });
        }

        // ============================================================
        // NATIVE GPU MAP ROTATION MATRIX
        // ============================================================
        function applyRotationSystem() {
            if (currentHeading === lastHeadingApplied) return;
            lastHeadingApplied = currentHeading;

            bearingEl.textContent = `${String(currentHeading).padStart(3, '0')}° ${getCompassLetter(currentHeading)}`;
            
            // Native GPU Bearing rotation. Rotates map map elements perfectly around center.
            map.setBearing(360 - currentHeading);
        }

        // ============================================================
        // SENSOR LAYER INTERFACES
        // ============================================================
        let frameThrottle = false;
        function handleOrientation(event) {
            let heading = null;
            if (event.webkitCompassHeading !== undefined) {
                heading = event.webkitCompassHeading;
            } else if (event.alpha !== null) {
                heading = 360 - event.alpha;
            }
            
            if (heading !== null && heading !== undefined) {
                currentHeading = Math.round(heading);
                
                if (!frameThrottle) {
                    window.requestAnimationFrame(() => {
                        applyRotationSystem();
                        frameThrottle = false;
                    });
                    frameThrottle = true;
                }
            }
        }

        if (window.DeviceOrientationEvent) {
            if (typeof DeviceOrientationEvent.requestPermission === 'function') {
                document.body.addEventListener('click', function() {
                    DeviceOrientationEvent.requestPermission()
                        .then(response => {
                            if (response === 'granted') {
                                window.addEventListener('deviceorientation', handleOrientation, true);
                            }
                        }).catch(console.error);
                }, { once: true });
            } else {
                window.addEventListener('deviceorientation', handleOrientation, true);
            }
        }

        // ============================================================
        // INTERACTIVE HUD CONTROLS
        // ============================================================
        function toggleSidebar() {
            document.getElementById('sidebar-panel').classList.toggle('open');
            document.getElementById('menu-btn').classList.toggle('open');
        }

        function toggleOption(type) {
            const btn = document.getElementById(`opt-${type}`);
            if (type === 'hud') {
                flagShowHUD = !flagShowHUD;
                document.getElementById('data-hud').style.opacity = flagShowHUD ? "1" : "0";
                btn.classList.toggle('active', flagShowHUD);
            } 
            else if (type === 'trail') {
                flagShowTrail = !flagShowTrail;
                updateTrailRenderPipeline();
                btn.classList.toggle('active', flagShowTrail);
            }
        }

        function getCompassLetter(deg) {
            const directions = ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'];
            return directions[Math.round(((deg % 360) / 45)) % 8];
        }

        // ============================================================
        // WAYPOINT SYSTEM CONTROLLER
        // ============================================================
        let waypointMarkersMap = {};

        function drawWaypointNode(id, lng, lat) {
            const el = document.createElement('div');
            el.style.width = '14px';
            el.style.height = '14px';
            el.style.backgroundColor = '#ff3366';
            el.style.borderRadius = '50%';
            el.style.border = '2px solid #fff';
            el.style.boxShadow = '0 0 8px #ff3366';
            el.style.cursor = 'pointer';

            const popup = new maplibregl.Popup({ offset: 10 }).setHTML(`
                <div style="font-family: monospace; text-align: center; color: #000; padding: 5px;">
                    <b>🚩 WAYPOINT LOCKED</b><br><br>
                    <button onclick="dismissWaypoint(${id})" style="background: #ff3366; color: white; border: none; padding: 4px 12px; border-radius: 4px; cursor: pointer; font-family: monospace; font-weight: bold;">🗑️ DISMISS</button>
                </div>
            `);

            const marker = new maplibregl.Marker({ element: el })
                .setLngLat([lng, lat])
                .setPopup(popup)
                .addTo(map);

            waypointMarkersMap[id] = marker;
        }

        function dismissWaypoint(id) {
            if (waypointMarkersMap[id]) {
                waypointMarkersMap[id].remove();
                delete waypointMarkersMap[id];
            }
            savedWaypoints = savedWaypoints.filter(wp => wp.id !== id);
            localStorage.setItem('nav_waypoints', JSON.stringify(savedWaypoints));
        }

        map.on('click', (e) => {
            // Stop waypoint placements if clicking on existing structural elements
            if (e.originalEvent.target.style.backgroundColor === 'rgb(255, 51, 102)') return;
            
            const lng = e.lngLat.lng;
            const lat = e.lngLat.lat;
            const id = Date.now();

            drawWaypointNode(id, lng, lat);
            savedWaypoints.push({ id, lng, lat });
            localStorage.setItem('nav_waypoints', JSON.stringify(savedWaypoints));
        });

        // ============================================================
        // MOTOR ENGINE HARDWARE GEOLOCATION SOURCE
        // ============================================================
        if (navigator.geolocation) {
            navigator.geolocation.watchPosition(
                pos => updateLocation(pos.coords.latitude, pos.coords.longitude, pos.coords.accuracy),
                err => { coordsEl.textContent = 'GPS BLOCKED'; },
                { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
            );
        } else {
            coordsEl.textContent = 'NO GPS HARDWARE';
        }
    </script>
</body>
</html>
