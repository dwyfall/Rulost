<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rulost</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <style>
        /* ============================================================
           RESET
           ============================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", sans-serif;
            background: #000;
            overflow: hidden;
            height: 100vh;
            color: #fff;
            -webkit-font-smoothing: antialiased;
        }
        
        #map {
            width: 100vw;
            height: 100vh;
            background: #0a0a0a;
        }
        
        /* ============================================================
           USER MARKER (Clean Minimal Arrow)
           ============================================================ */
        .user-marker-container {
            background: none !important;
            border: none !important;
        }
        .user-marker {
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            transform-origin: center center;
            will-change: transform;
        }
        .user-arrow {
            width: 0;
            height: 0;
            border-left: 9px solid transparent;
            border-right: 9px solid transparent;
            border-bottom: 22px solid #007aff;
            filter: drop-shadow(0 2px 8px rgba(0, 122, 255, 0.5));
        }
        
        /* ============================================================
           WAYPOINT MARKER (Pin)
           ============================================================ */
        .waypoint-pin {
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
            font-size: 18px;
            transition: 0.2s ease;
        }
        .waypoint-pin:hover {
            transform: scale(1.08);
        }
        
        /* ============================================================
           MAGNIFYING GLASS (Drag Preview)
           ============================================================ */
        .magnifying-glass {
            position: fixed;
            z-index: 9999;
            pointer-events: none;
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.2);
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            overflow: hidden;
            display: none;
            transform: translate(-50%, -50%);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        }
        .magnifying-glass .zoom-content {
            width: 200%;
            height: 200%;
            background-size: cover;
            background-position: center;
            image-rendering: auto;
        }
        .magnifying-glass .crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 20px;
            height: 20px;
            transform: translate(-50%, -50%);
            border: 2px solid rgba(255, 255, 255, 0.6);
            border-radius: 50%;
        }
        .magnifying-glass .crosshair::before {
            content: '+';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: rgba(255, 255, 255, 0.8);
            font-size: 16px;
            font-weight: 300;
        }
        
        /* ============================================================
           HUD (Glassmorphism, Minimal)
           ============================================================ */
        .hud {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 999;
            background: rgba(0, 0, 0, 0.55);
            backdrop-filter: blur(24px) saturate(1.4);
            -webkit-backdrop-filter: blur(24px) saturate(1.4);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 16px;
            padding: 10px 20px;
            width: 90%;
            max-width: 360px;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }
        
        .hud-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 4px;
            text-align: center;
        }
        
        .hud-item {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .hud-label {
            font-size: 9px;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: rgba(255, 255, 255, 0.3);
            font-weight: 600;
        }
        
        .hud-value {
            font-size: 14px;
            font-weight: 500;
            color: #fff;
            letter-spacing: 0.02em;
            margin-top: 1px;
        }
        
        .hud-value .highlight {
            color: #007aff;
        }
        
        .hud-value .dim {
            color: rgba(255, 255, 255, 0.5);
            font-size: 12px;
        }
        
        /* ============================================================
           SIDEBAR (Glassmorphism)
           ============================================================ */
        .sidebar {
            position: fixed;
            top: 0;
            left: -280px;
            width: 260px;
            height: 100vh;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(40px) saturate(1.4);
            -webkit-backdrop-filter: blur(40px) saturate(1.4);
            border-right: 1px solid rgba(255, 255, 255, 0.05);
            z-index: 2000;
            transition: left 0.35s cubic-bezier(0.2, 0.9, 0.3, 1);
            padding: 80px 20px 20px 20px;
        }
        
        .sidebar.open {
            left: 0;
        }
        
        .sidebar-title {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: rgba(255, 255, 255, 0.3);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding-bottom: 12px;
            margin-bottom: 16px;
            font-weight: 600;
        }
        
        .sidebar button {
            display: block;
            width: 100%;
            padding: 10px 14px;
            margin-bottom: 4px;
            background: rgba(255, 255, 255, 0.02);
            border: none;
            border-radius: 10px;
            color: rgba(255, 255, 255, 0.6);
            font-family: inherit;
            font-size: 14px;
            font-weight: 400;
            text-align: left;
            cursor: pointer;
            transition: 0.15s ease;
        }
        
        .sidebar button:hover {
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
        }
        
        .sidebar button.active {
            background: rgba(0, 122, 255, 0.12);
            color: #fff;
        }
        
        .sidebar button .badge {
            float: right;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.2);
        }
        
        .sidebar button.active .badge {
            color: #007aff;
        }
        
        /* ============================================================
           HAMBURGER (Clean, Minimal)
           ============================================================ */
        .hamburger {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 2100;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 12px;
            width: 40px;
            height: 40px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 4px;
            transition: 0.2s ease;
        }
        
        .hamburger:hover {
            background: rgba(255, 255, 255, 0.06);
        }
        
        .hamburger .bar {
            width: 18px;
            height: 1.5px;
            background: rgba(255, 255, 255, 0.7);
            border-radius: 2px;
            transition: 0.3s ease;
        }
        
        .hamburger.open .bar:nth-child(1) {
            transform: rotate(-45deg) translate(-4px, 4px);
        }
        .hamburger.open .bar:nth-child(2) {
            opacity: 0;
        }
        .hamburger.open .bar:nth-child(3) {
            transform: rotate(45deg) translate(-4px, -4px);
        }
        
        /* ============================================================
           ACTION BUTTON (Drop Waypoint - Pin Icon)
           ============================================================ */
        .action-btn {
            position: fixed;
            bottom: 40px;
            right: 24px;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 50%;
            width: 56px;
            height: 56px;
            color: #fff;
            font-size: 24px;
            cursor: grab;
            transition: 0.2s ease;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            touch-action: none;
        }
        
        .action-btn:hover {
            background: rgba(255, 255, 255, 0.12);
            transform: scale(1.04);
        }
        
        .action-btn:active {
            cursor: grabbing;
            transform: scale(0.92);
        }
        
        .action-btn .pin-icon {
            font-size: 28px;
            line-height: 1;
        }
        
        /* ============================================================
           MAP CONTROLS OVERRIDE
           ============================================================ */
        .leaflet-control-layers {
            background: rgba(0, 0, 0, 0.6) !important;
            backdrop-filter: blur(20px) !important;
            -webkit-backdrop-filter: blur(20px) !important;
            border: 1px solid rgba(255, 255, 255, 0.06) !important;
            border-radius: 12px !important;
            color: #fff !important;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif !important;
        }
        
        .leaflet-control-layers label {
            color: #fff !important;
            font-weight: 400 !important;
            font-size: 13px !important;
        }
        
        .leaflet-control-layers-selector {
            accent-color: #007aff !important;
        }
        
        .leaflet-popup-content-wrapper {
            background: rgba(0, 0, 0, 0.85) !important;
            backdrop-filter: blur(20px) !important;
            border: 1px solid rgba(255, 255, 255, 0.06) !important;
            border-radius: 12px !important;
            color: #fff !important;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif !important;
        }
        
        .leaflet-popup-tip {
            background: rgba(0, 0, 0, 0.85) !important;
        }
    </style>
</head>
<body>

    <button class="hamburger" id="menu-btn" onclick="toggleSidebar()">
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
    </button>

    <div class="sidebar" id="sidebar-panel">
        <div class="sidebar-title">Settings</div>
        <button class="active" id="opt-hud" onclick="toggleOption('hud')">
            <span>HUD</span>
            <span class="badge">●</span>
        </button>
        <button class="active" id="opt-trail" onclick="toggleOption('trail')">
            <span>Trail</span>
            <span class="badge">●</span>
        </button>
        <button onclick="clearTrail()">
            <span>Clear Trail</span>
            <span class="badge">↺</span>
        </button>
        <button onclick="clearWaypoints()">
            <span>Clear Waypoints</span>
            <span class="badge">✕</span>
        </button>
        <button onclick="centerMap()">
            <span>Center on Me</span>
            <span class="badge">⌖</span>
        </button>
    </div>

    <div class="hud" id="data-hud">
        <div class="hud-grid">
            <div class="hud-item">
                <span class="hud-label">Position</span>
                <span class="hud-value" id="coords">---</span>
            </div>
            <div class="hud-item">
                <span class="hud-label">Accuracy</span>
                <span class="hud-value"><span class="dim" id="accuracy">---</span></span>
            </div>
            <div class="hud-item">
                <span class="hud-label">Heading</span>
                <span class="hud-value" id="bearing">---</span>
            </div>
        </div>
    </div>

    <div id="map"></div>

    <div class="magnifying-glass" id="magnifying-glass">
        <div class="zoom-content" id="zoom-content"></div>
        <div class="crosshair"></div>
    </div>

    <button class="action-btn" id="drop-btn" title="Drag to drop waypoint">
        <span class="pin-icon">📍</span>
    </button>

    <script>
        // ============================================================
        // MAP
        // ============================================================
        const streetLayer = L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
            attribution: '© CARTO',
            maxZoom: 20
        });

        const satelliteLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            attribution: '© Esri',
            maxZoom: 19
        });

        const map = L.map('map', {
            zoomControl: false,
            center: [0, 0],
            zoom: 2,
            preferCanvas: true,
            layers: [streetLayer]
        });

        L.control.layers(
            { "🗺️ Street": streetLayer, "🛰️ Satellite": satelliteLayer },
            null,
            { position: 'topright' }
        ).addTo(map);

        // ============================================================
        // STATE
        // ============================================================
        let userMarker = null;
        let accuracyCircle = null;
        let isFirstLocation = true;
        let currentHeading = 0;
        let lastHeadingApplied = -1;

        let showHUD = true;
        let showTrail = true;

        let trailPoints = [];
        const trailLine = L.polyline([], {
            color: '#007aff',
            weight: 2.5,
            opacity: 0.4,
            smoothFactor: 1.5
        }).addTo(map);

        let waypoints = [];
        try {
            const savedData = JSON.parse(localStorage.getItem('rulost_waypoints')) || [];
            // We only grab data properties, instances are handled by loadWaypoints
        } catch (e) {
            console.error(e);
        }

        const coordsEl = document.getElementById('coords');
        const accuracyEl = document.getElementById('accuracy');
        const bearingEl = document.getElementById('bearing');
        const hudEl = document.getElementById('data-hud');
        const magGlass = document.getElementById('magnifying-glass');
        const zoomContent = document.getElementById('zoom-content');

        // ============================================================
        // WAYPOINT MARKER
        // ============================================================
        function createWaypoint(id, lat, lng) {
            const icon = L.divIcon({
                html: `<div class="waypoint-pin">📍</div>`,
                iconSize: [36, 36],
                iconAnchor: [18, 36],
                className: ''
            });

            const marker = L.marker([lat, lng], { icon }).addTo(map);

            marker.bindPopup(`
                <div style="font-family: -apple-system, sans-serif; text-align: center; padding: 4px 0;">
                    <div style="font-weight: 600; font-size: 14px; margin-bottom: 6px;">📍 Waypoint</div>
                    <div style="font-size: 11px; color: rgba(255,255,255,0.5); margin-bottom: 8px;">
                        ${lat.toFixed(5)}, ${lng.toFixed(5)}
                    </div>
                    <button onclick="deleteWaypoint('${id}')" 
                        style="background: #ff3b30; color: #fff; border: none; padding: 6px 16px; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 500;">
                        Delete
                    </button>
                </div>
            `);

            waypoints.push({ id, lat, lng, marker });
            saveWaypoints();
        }

        function saveWaypoints() {
            const data = waypoints.map(w => ({ id: w.id, lat: w.lat, lng: w.lng }));
            localStorage.setItem('rulost_waypoints', JSON.stringify(data));
        }

        window.deleteWaypoint = function(id) {
            const idx = waypoints.findIndex(w => w.id === id);
            if (idx !== -1) {
                map.removeLayer(waypoints[idx].marker);
                waypoints.splice(idx, 1);
                saveWaypoints();
            }
        };

        function loadWaypoints() {
            try {
                const data = JSON.parse(localStorage.getItem('rulost_waypoints')) || [];
                data.forEach(w => {
                    createWaypoint(w.id, w.lat, w.lng);
                });
            } catch(e) {
                console.error(e);
            }
        }

        // ============================================================
        // LOCATION
        // ============================================================
        function updateLocation(lat, lng, accuracy = null) {
            coordsEl.textContent = `${lat.toFixed(5)}, ${lng.toFixed(5)}`;
            accuracyEl.textContent = accuracy ? `±${Math.round(accuracy)}m` : '---';

            if (trailPoints.length === 0 || L.latLng(trailPoints[trailPoints.length - 1]).distanceTo([lat, lng]) > 5) {
                trailPoints.push([lat, lng]);
                if (showTrail) trailLine.setLatLngs(trailPoints);
            }

            if (!accuracyCircle) {
                accuracyCircle = L.circle([lat, lng], {
                    radius: accuracy || 20,
                    color: '#007aff',
                    fillColor: '#007aff',
                    fillOpacity: 0.06,
                    weight: 1
                }).addTo(map);
            } else {
                accuracyCircle.setLatLng([lat, lng]);
                if (accuracy) accuracyCircle.setRadius(accuracy);
            }

            if (!userMarker) {
                const icon = L.divIcon({
                    className: 'user-marker-container',
                    html: `<div class="user-marker" id="arrow-element"><div class="user-arrow"></div></div>`,
                    iconSize: [28, 28],
                    iconAnchor: [14, 14]
                });
                userMarker = L.marker([lat, lng], { icon }).addTo(map);
            } else {
                userMarker.setLatLng([lat, lng]);
            }

            applyRotation();

            if (isFirstLocation) {
                map.setView([lat, lng], 17);
                isFirstLocation = false;
            }
        }

        // ============================================================
        // COMPASS
        // ============================================================
        function applyRotation() {
            if (currentHeading === lastHeadingApplied) return;
            lastHeadingApplied = currentHeading;

            const dirs = ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'];
            const idx = Math.round(((currentHeading % 360) / 45)) % 8;
            bearingEl.textContent = `${String(currentHeading).padStart(3, '0')}° ${dirs[idx]}`;

            const arrow = document.getElementById('arrow-element');
            if (arrow) {
                arrow.style.transform = `rotate(${currentHeading}deg)`;
            }
        }

        function handleOrientation(e) {
            let heading = e.webkitCompassHeading ?? (e.alpha !== null ? 360 - e.alpha : null);
            if (heading !== null && heading !== undefined) {
                currentHeading = Math.round(heading);
                applyRotation();
            }
        }

        if (window.DeviceOrientationEvent) {
            if (typeof DeviceOrientationEvent.requestPermission === 'function') {
                document.addEventListener('click', function initCompass() {
                    DeviceOrientationEvent.requestPermission().then(r => {
                        if (r === 'granted') {
                            window.addEventListener('deviceorientation', handleOrientation);
                        }
                    });
                    document.removeEventListener('click', initCompass);
                });
            } else {
                window.addEventListener('deviceorientation', handleOrientation);
            }
        }

        // ============================================================
        // DROP WAYPOINT (Right-click only for PC)
        // ============================================================
        map.on('contextmenu', function(e) {
            const id = Date.now().toString();
            createWaypoint(id, e.latlng.lat, e.latlng.lng);
        });

        // ============================================================
        // DRAG-AND-DROP PIN (Fixed position restoration)
        // ============================================================
        const dropBtn = document.getElementById('drop-btn');
        let isDragging = false;
        let offsetX = 0, offsetY = 0;

        function updateMagnifyingGlass(clientX, clientY) {
            const mapContainer = map.getContainer();
            const rect = mapContainer.getBoundingClientRect();
            const x = clientX - rect.left;
            const y = clientY - rect.top;

            if (x >= 0 && x <= rect.width && y >= 0 && y <= rect.height) {
                magGlass.style.display = 'block';
                magGlass.style.left = clientX + 'px';
                magGlass.style.top = (clientY - 60) + 'px';

                // Update zoom preview
                const latlng = map.containerPointToLatLng([x, y]);
                const zoomedCenter = map.project(latlng, map.getZoom() + 2);
                const tileSize = 256;
                const scale = 2;
                const baseUrl = 'https://a.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}.png';
                const url = baseUrl
                    .replace('{z}', map.getZoom() + 2)
                    .replace('{x}', Math.floor(zoomedCenter.x / tileSize))
                    .replace('{y}', Math.floor(zoomedCenter.y / tileSize));
                zoomContent.style.backgroundImage = `url('${url}')`;
                zoomContent.style.backgroundSize = `${tileSize * scale}px ${tileSize * scale}px`;
                zoomContent.style.backgroundPosition = `-${(zoomedCenter.x % tileSize) * scale}px -${(zoomedCenter.y % tileSize) * scale}px`;
            } else {
                magGlass.style.display = 'none';
            }
        }

        // Touch events (mobile)
        dropBtn.addEventListener('touchstart', function(e) {
            const touch = e.touches[0];
            const rect = dropBtn.getBoundingClientRect();
            offsetX = touch.clientX - rect.left;
            offsetY = touch.clientY - rect.top;
            isDragging = true;
            dropBtn.style.opacity = '0.6';
        }, { passive: true });

        document.addEventListener('touchmove', function(e) {
            if (!isDragging) return;
            e.preventDefault();
            const touch = e.touches[0];
            // Move the button with finger
            dropBtn.style.position = 'fixed';
            dropBtn.style.left = (touch.clientX - offsetX) + 'px';
            dropBtn.style.top = (touch.clientY - offsetY) + 'px';
            dropBtn.style.bottom = 'auto';
            dropBtn.style.right = 'auto';
            updateMagnifyingGlass(touch.clientX, touch.clientY);
        }, { passive: false });

        document.addEventListener('touchend', function(e) {
            if (!isDragging) return;
            isDragging = false;
            dropBtn.style.opacity = '1';
            magGlass.style.display = 'none';

            const touch = e.changedTouches[0];
            const mapContainer = map.getContainer();
            const rect = mapContainer.getBoundingClientRect();
            const x = touch.clientX - rect.left;
            const y = touch.clientY - rect.top;

            if (x >= 0 && x <= rect.width && y >= 0 && y <= rect.height) {
                const latlng = map.containerPointToLatLng([x, y]);
                const id = Date.now().toString();
                createWaypoint(id, latlng.lat, latlng.lng);
            }

            // CRITICAL FIX: Strip left/top completely so CSS fallback positioning hooks back up
            dropBtn.style.left = '';
            dropBtn.style.top = '';
            dropBtn.style.position = 'fixed';
            dropBtn.style.bottom = '40px';
            dropBtn.style.right = '24px';
        }, { passive: true });

        // Mouse events (PC drag)
        dropBtn.addEventListener('mousedown', function(e) {
            const rect = dropBtn.getBoundingClientRect();
            offsetX = e.clientX - rect.left;
            offsetY = e.clientY - rect.top;
            isDragging = true;
            dropBtn.style.cursor = 'grabbing';
            dropBtn.style.opacity = '0.6';
        });

        document.addEventListener('mousemove', function(e) {
            if (!isDragging) return;
            dropBtn.style.position = 'fixed';
            dropBtn.style.left = (e.clientX - offsetX) + 'px';
            dropBtn.style.top = (e.clientY - offsetY) + 'px';
            dropBtn.style.bottom = 'auto';
            dropBtn.style.right = 'auto';
            updateMagnifyingGlass(e.clientX, e.clientY);
        });

        document.addEventListener('mouseup', function(e) {
            if (!isDragging) return;
            isDragging = false;
            dropBtn.style.cursor = 'grab';
            dropBtn.style.opacity = '1';
            magGlass.style.display = 'none';

            const mapContainer = map.getContainer();
            const rect = mapContainer.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            if (x >= 0 && x <= rect.width && y >= 0 && y <= rect.height) {
                const latlng = map.containerPointToLatLng([x, y]);
                const id = Date.now().toString();
                createWaypoint(id, latlng.lat, latlng.lng);
            }

            // CRITICAL FIX: Strip left/top completely so CSS fallback positioning hooks back up
            dropBtn.style.left = '';
            dropBtn.style.top = '';
            dropBtn.style.position = 'fixed';
            dropBtn.style.bottom = '40px';
            dropBtn.style.right = '24px';
        });

        // Load saved waypoints
        loadWaypoints();

        // ============================================================
        // GPS
        // ============================================================
        if (navigator.geolocation) {
            navigator.geolocation.watchPosition(
                pos => updateLocation(pos.coords.latitude, pos.coords.longitude, pos.coords.accuracy),
                err => { coordsEl.textContent = 'No GPS'; },
                { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
            );
        } else {
            coordsEl.textContent = 'No GPS';
        }

        // ============================================================
        // SIDEBAR
        // ============================================================
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar-panel');
            const trigger = document.getElementById('menu-btn');
            sidebar.classList.toggle('open');
            trigger.classList.toggle('open');
        }

        function toggleOption(type) {
            const btn = document.getElementById(`opt-${type}`);
            if (type === 'hud') {
                showHUD = !showHUD;
                hudEl.style.opacity = showHUD ? '1' : '0';
                btn.classList.toggle('active', showHUD);
            } else if (type === 'trail') {
                showTrail = !showTrail;
                if (showTrail) {
                    trailLine.setLatLngs(trailPoints);
                } else {
                    trailLine.setLatLngs([]);
                }
                btn.classList.toggle('active', showTrail);
            }
        }

        function clearTrail() {
            trailPoints = [];
            trailLine.setLatLngs([]);
        }

        function clearWaypoints() {
            if (confirm('Delete all waypoints?')) {
                waypoints.forEach(w => map.removeLayer(w.marker));
                waypoints = [];
                saveWaypoints();
            }
        }

        function centerMap() {
            if (userMarker) {
                const pos = userMarker.getLatLng();
                map.setView([pos.lat, pos.lng], 17);
            }
        }

        window.toggleSidebar = toggleSidebar;
        window.toggleOption = toggleOption;
        window.clearTrail = clearTrail;
        window.clearWaypoints = clearWaypoints;
        window.centerMap = centerMap;
    </script>
</body>
</html>
