<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rulost</title>
    
    <!-- Web Icon (Favicon) -->
    <link rel="icon" type="image/png" href="https://maps.google.com/mapfiles/kml/paddle/blu-blank.png">
    
    <!-- Leaflet.js -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
            background: #000;
            overflow: hidden;
            height: 100vh;
            color: #fff;
            -webkit-font-smoothing: antialiased;
        }
        
        #map {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
            background: #111;
        }
        
        .user-marker-container {
            background: none !important;
            border: none !important;
        }
        .user-marker {
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            will-change: transform;
        }
        .user-arrow {
            width: 0;
            height: 0;
            border-left: 9px solid transparent;
            border-right: 9px solid transparent;
            border-bottom: 22px solid var(--arrow-color, #007aff);
            filter: drop-shadow(0 2px 8px rgba(0, 122, 255, 0.4));
        }
        
        .waypoint-pin {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
            font-size: calc(var(--pin-size, 36px) * 0.5);
        }
        
        .magnifying-glass {
            position: fixed;
            z-index: 9999;
            pointer-events: none;
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.2);
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            overflow: hidden;
            display: none;
            transform: translate(-50%, -50%);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        }
        .magnifying-glass .zoom-content {
            width: 200%;
            height: 200%;
            background-size: cover;
            background-position: center;
        }
        .magnifying-glass .crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 20px;
            height: 20px;
            transform: translate(-50%, -50%);
            border: 2px solid rgba(255, 255, 255, 0.6);
            border-radius: 50%;
        }
        .magnifying-glass .crosshair::before {
            content: '+';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: rgba(255, 255, 255, 0.8);
            font-size: 16px;
        }
        
        .hud {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 999;
            background: rgba(0, 0, 0, 0.55);
            backdrop-filter: blur(24px) saturate(1.4);
            -webkit-backdrop-filter: blur(24px) saturate(1.4);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 16px;
            padding: 10px 20px;
            width: 90%;
            max-width: 360px;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }
        .hud-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 4px;
            text-align: center;
        }
        .hud-item {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .hud-label {
            font-size: 9px;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: rgba(255, 255, 255, 0.3);
            font-weight: 600;
        }
        .hud-value {
            font-size: 14px;
            font-weight: 500;
            color: #fff;
            margin-top: 1px;
        }
        .hud-value .dim {
            color: rgba(255, 255, 255, 0.5);
            font-size: 12px;
        }
        
        .sidebar-wrapper {
            position: fixed;
            top: 0;
            left: -300px;
            width: 280px;
            height: 100vh;
            background: rgba(15, 15, 15, 0.85);
            backdrop-filter: blur(40px) saturate(1.6);
            -webkit-backdrop-filter: blur(40px) saturate(1.6);
            border-right: 1px solid rgba(255, 255, 255, 0.08);
            z-index: 2000;
            transition: left 0.35s cubic-bezier(0.2, 0.9, 0.3, 1);
            overflow: hidden;
        }
        .sidebar-wrapper.open {
            left: 0;
        }
        
        .sidebar-scroller {
            display: flex;
            width: 560px;
            height: 100%;
            transition: transform 0.3s cubic-bezier(0.25, 1, 0.5, 1);
        }
        .sidebar-scroller.in-settings {
            transform: translateX(-280px);
        }
        
        .menu-view, .settings-view {
            width: 280px;
            height: 100%;
            padding: 85px 16px 20px 16px;
            overflow-y: auto;
        }
        
        .sidebar-title {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: rgba(255, 255, 255, 0.4);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding-bottom: 12px;
            margin-bottom: 16px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        
        .back-link {
            cursor: pointer;
            color: #007aff;
            font-weight: 500;
            text-transform: none;
            letter-spacing: normal;
            font-size: 14px;
        }
        
        .sidebar-wrapper button, .setting-row-btn {
            display: flex !important;
            align-items: center;
            justify-content: space-between;
            width: 100% !important;
            padding: 12px 14px !important;
            margin-bottom: 8px !important;
            background: rgba(255, 255, 255, 0.04) !important;
            border: none !important;
            border-radius: 10px !important;
            color: rgba(255, 255, 255, 0.85) !important;
            font-family: inherit !important;
            font-size: 14px !important;
            font-weight: 500 !important;
            text-align: left !important;
            cursor: pointer !important;
            transition: background 0.2s ease, color 0.2s ease !important;
        }
        .sidebar-wrapper button:hover, .setting-row-btn:hover {
            background: rgba(255, 255, 255, 0.08) !important;
            color: #fff !important;
        }
        .sidebar-wrapper button.active {
            background: rgba(0, 122, 255, 0.15) !important;
            color: #fff !important;
        }
        
        .hamburger {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 2100;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 12px;
            width: 40px;
            height: 40px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 4px;
            transition: 0.2s ease;
        }
        .hamburger:hover { background: rgba(255, 255, 255, 0.06); }
        .hamburger.open .bar:nth-child(1) { transform: rotate(-45deg) translate(-4px, 4px); }
        .hamburger.open .bar:nth-child(2) { opacity: 0; }
        .hamburger.open .bar:nth-child(3) { transform: rotate(45deg) translate(-4px, -4px); }
        
        .action-btn {
            position: fixed;
            bottom: 40px;
            right: 24px;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 50%;
            width: 56px;
            height: 56px;
            color: #fff;
            font-size: 24px;
            cursor: grab;
            transition: 0.2s ease;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            touch-action: none;
        }
        
        .leaflet-control-layers {
            background: rgba(0, 0, 0, 0.6) !important;
            backdrop-filter: blur(20px) !important;
            border: 1px solid rgba(255, 255, 255, 0.06) !important;
            border-radius: 12px !important;
            color: #fff !important;
        }
        .leaflet-control-layers label { color: #fff !important; font-size: 13px !important; }
        .leaflet-control-layers-selector { accent-color: #007aff !important; }
    </style>
</head>
<body onclick="requestOrientationPermission()">

    <button class="hamburger" id="menu-btn" onclick="toggleSidebar(); event.stopPropagation();">
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
    </button>

    <div class="sidebar-wrapper" id="sidebar-panel" onclick="event.stopPropagation();">
        <div class="sidebar-scroller" id="sidebar-scroller">
            
            <div class="menu-view">
                <div class="sidebar-title">Menu</div>
                
                <button class="active" id="opt-hud" onclick="toggleOption('hud')">
                    <span>HUD Display</span>
                </button>
                
                <button class="active" id="opt-trail" onclick="toggleOption('trail')">
                    <span>Tracking Trail</span>
                </button>

                <button onclick="clearTrail()">
                    <span>Clear Trail</span>
                </button>
                
                <button onclick="centerMap()">
                    <span>Center on Me</span>
                </button>
            </div>
        </div>
    </div>

    <div class="hud" id="data-hud">
        <div class="hud-grid">
            <div class="hud-item">
                <span class="hud-label">Position</span>
                <span class="hud-value" id="coords">---</span>
            </div>
            <div class="hud-item">
                <span class="hud-label">Accuracy</span>
                <span class="hud-value"><span class="dim" id="accuracy">---</span></span>
            </div>
            <div class="hud-item">
                <span class="hud-label">Heading</span>
                <span class="hud-value" id="bearing">---</span>
            </div>
        </div>
    </div>

    <div id="map"></div>

    <div class="magnifying-glass" id="magnifying-glass">
        <div class="zoom-content" id="zoom-content"></div>
        <div class="crosshair"></div>
    </div>

    <button class="action-btn" id="drop-btn" title="Drag to drop waypoint" onclick="event.stopPropagation();">
        <span class="pin-icon" id="drop-btn-icon">📍</span>
    </button>

    <script>
        // Set up Map layers, adding a high accuracy OpenTopoMap + Grid Overlay
        const streetLayer = L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', { attribution: '© CARTO' });
        const satelliteLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { attribution: '© Esri' });
        
        // This topographic matrix completely disables auto-road snapping lines
        const preciseGridLayer = L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {
            maxZoom: 17, attribution: '© OpenTopoMap'
        });

        const map = L.map('map', {
            zoomControl: false, center: [11.56494, 104.91438], zoom: 16, layers: [preciseGridLayer]
        });

        L.control.layers({ "🎯 Grid Matrix Map": preciseGridLayer, "🛰️ Satellite": satelliteLayer, "🗺️ Standard Street": streetLayer }, null, { position: 'topright' }).addTo(map);

        let userMarker = null;
        let accuracyCircle = null;
        let isFirstLocation = true;
        
        // Target heading vs Interpolated engine heading (Updates every 16ms animation frame)
        let targetHeading = 0;
        let currentHeading = 0; 
        let compassAttached = false;

        let showHUD = true;
        let showTrail = true;
        let trailPoints = [];
        const trailLine = L.polyline([], { color: '#007aff', weight: 2.5, opacity: 0.4 }).addTo(map);

        const coordsEl = document.getElementById('coords');
        const accuracyEl = document.getElementById('accuracy');
        const bearingEl = document.getElementById('bearing');
        const hudEl = document.getElementById('data-hud');

        // ============================================================
        // HIGH FREQUENCY ENGINE (Updates every millisecond frame)
        // ============================================================
        function runEngineLoop() {
            // Smoothly lerp towards our target sensor degree to eliminate layout jitter
            let diff = targetHeading - currentHeading;
            
            // Handle degree looping boundary logic safely (e.g., crossing 360 to 0)
            while (diff < -180) diff += 360;
            while (diff > 180) diff -= 360;
            
            currentHeading += diff * 0.22; // High coefficient response speed
            currentHeading = (currentHeading + 360) % 360;

            const arrow = document.getElementById('arrow-element');
            if (arrow) {
                arrow.style.transform = `rotate(${Math.round(currentHeading)}deg)`;
            }

            if(bearingEl) {
                const dirs = ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'];
                const idx = Math.round(((currentHeading % 360) / 45)) % 8;
                bearingEl.textContent = `${String(Math.round(currentHeading)).padStart(3, '0')}° ${dirs[idx]}`;
            }

            requestAnimationFrame(runEngineLoop);
        }
        // Fire up engine tracking
        requestAnimationFrame(runEngineLoop);

        function handleOrientation(e) {
            let heading = e.webkitCompassHeading ?? (e.alpha !== null ? 360 - e.alpha : null);
            if (heading !== null && heading !== undefined) {
                targetHeading = Math.round(heading);
            }
        }

        function requestOrientationPermission() {
            if (compassAttached) return;
            if (window.DeviceOrientationEvent && typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission()
                    .then(permissionState => {
                        if (permissionState === 'granted') {
                            window.addEventListener('deviceorientation', handleOrientation, true);
                            compassAttached = true;
                        }
                    }).catch(console.error);
            } else if (window.DeviceOrientationEvent) {
                window.addEventListener('deviceorientation', handleOrientation, true);
                compassAttached = true;
            }
        }

        function updateLocation(lat, lng, accuracy = null) {
            if(coordsEl) coordsEl.textContent = `${lat.toFixed(5)}, ${lng.toFixed(5)}`;
            if(accuracyEl) accuracyEl.textContent = accuracy ? `±${Math.round(accuracy)}m` : '---';

            if (showTrail && (trailPoints.length === 0 || L.latLng(trailPoints[trailPoints.length - 1]).distanceTo([lat, lng]) > 1)) {
                trailPoints.push([lat, lng]);
                trailLine.setLatLngs(trailPoints);
            }

            if (!accuracyCircle) {
                accuracyCircle = L.circle([lat, lng], { radius: accuracy || 15, color: '#007aff', fillColor: '#007aff', fillOpacity: 0.06, weight: 1 }).addTo(map);
            } else {
                accuracyCircle.setLatLng([lat, lng]);
                if (accuracy) accuracyCircle.setRadius(accuracy);
            }

            if (!userMarker) {
                const icon = L.divIcon({
                    className: 'user-marker-container',
                    html: `<div class="user-marker" id="arrow-element"><div class="user-arrow"></div></div>`,
                    iconSize: [28, 28], iconAnchor: [14, 14]
                });
                userMarker = L.marker([lat, lng], { icon }).addTo(map);
            } else { userMarker.setLatLng([lat, lng]); }

            if (isFirstLocation) { map.setView([lat, lng], 17); isFirstLocation = false; }
        }

        if (navigator.geolocation) {
            navigator.geolocation.watchPosition(
                pos => updateLocation(pos.coords.latitude, pos.coords.longitude, pos.coords.accuracy),
                err => {}, { enableHighAccuracy: true, timeout: 5000, maximumAge: 0 }
            );
        }

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar-panel');
            const trigger = document.getElementById('menu-btn');
            if(sidebar && trigger) {
                sidebar.classList.toggle('open');
                trigger.classList.toggle('open');
            }
        }

        function toggleOption(type) {
            const btn = document.getElementById(`opt-${type}`);
            if (type === 'hud') {
                showHUD = !showHUD;
                if(hudEl) hudEl.style.opacity = showHUD ? '1' : '0';
                if(btn) btn.classList.toggle('active', showHUD);
            } else if (type === 'trail') {
                showTrail = !showTrail;
                if (showTrail) { trailLine.setLatLngs(trailPoints); } else { trailLine.setLatLngs([]); }
                if(btn) btn.classList.toggle('active', showTrail);
            }
        }

        function clearTrail() { trailPoints = []; trailLine.setLatLngs([]); }
        function centerMap() {
            requestOrientationPermission();
            if (userMarker) map.setView(userMarker.getLatLng());
        }

        window.toggleSidebar = toggleSidebar;
        window.toggleOption = toggleOption;
        window.clearTrail = clearTrail;
        window.centerMap = centerMap;
        window.requestOrientationPermission = requestOrientationPermission;
    </script>
</body>
</html>
