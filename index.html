<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rulost</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <style>
        /* ============================================================
           RESET
           ============================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", sans-serif;
            background: #000;
            overflow: hidden;
            height: 100vh;
            color: #fff;
            -webkit-font-smoothing: antialiased;
        }
        
        #map {
            width: 100vw;
            height: 100vh;
            background: #0a0a0a;
        }
        
        /* ============================================================
           USER MARKER (Clean Minimal Arrow)
           ============================================================ */
        .user-marker-container {
            background: none !important;
            border: none !important;
        }
        .user-marker {
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            transform-origin: center center;
            will-change: transform;
        }
        .user-arrow {
            width: 0;
            height: 0;
            border-left: 9px solid transparent;
            border-right: 9px solid transparent;
            border-bottom: 22px solid #007aff;
            filter: drop-shadow(0 2px 8px rgba(0, 122, 255, 0.5));
        }
        
        /* ============================================================
           WAYPOINT MARKER (Pin Style)
           ============================================================ */
        .waypoint-pin {
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
            font-size: 18px;
            transition: 0.2s ease;
        }
        .waypoint-pin:hover {
            transform: scale(1.08);
        }
        
        /* ============================================================
           MAGNIFYING GLASS (Drag Preview)
           ============================================================ */
        .magnifying-glass {
            position: fixed;
            z-index: 9999;
            pointer-events: none;
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.2);
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            overflow: hidden;
            display: none;
            transform: translate(-50%, -50%);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        }
        .magnifying-glass .zoom-content {
            width: 200%;
            height: 200%;
            background-size: cover;
            background-position: center;
            image-rendering: auto;
        }
        .magnifying-glass .crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 20px;
            height: 20px;
            transform: translate(-50%, -50%);
            border: 2px solid rgba(255, 255, 255, 0.6);
            border-radius: 50%;
        }
        .magnifying-glass .crosshair::before {
            content: '+';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: rgba(255, 255, 255, 0.8);
            font-size: 16px;
            font-weight: 300;
        }
        
        /* ============================================================
           HUD (Glassmorphism, Minimal)
           ============================================================ */
        .hud {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 999;
            background: rgba(0, 0, 0, 0.55);
            backdrop-filter: blur(24px) saturate(1.4);
            -webkit-backdrop-filter: blur(24px) saturate(1.4);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 16px;
            padding: 10px 20px;
            width: 90%;
            max-width: 360px;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }
        
        .hud-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 4px;
            text-align: center;
        }
        
        .hud-item {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .hud-label {
            font-size: 9px;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: rgba(255, 255, 255, 0.3);
            font-weight: 600;
        }
        
        .hud-value {
            font-size: 14px;
            font-weight: 500;
            color: #fff;
            letter-spacing: 0.02em;
            margin-top: 1px;
        }
        
        .hud-value .dim {
            color: rgba(255, 255, 255, 0.5);
            font-size: 12px;
        }
        
        /* ============================================================
           SIDEBAR MENU (Glassmorphism)
           ============================================================ */
        .sidebar {
            position: fixed;
            top: 0;
            left: -300px;
            width: 280px;
            height: 100vh;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(40px) saturate(1.4);
            -webkit-backdrop-filter: blur(40px) saturate(1.4);
            border-right: 1px solid rgba(255, 255, 255, 0.05);
            z-index: 2000;
            transition: left 0.35s cubic-bezier(0.2, 0.9, 0.3, 1);
            padding: 80px 16px 20px 16px;
            overflow-y: auto;
        }
        
        .sidebar.open {
            left: 0;
        }
        
        .sidebar-title {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: rgba(255, 255, 255, 0.3);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding-bottom: 12px;
            margin-bottom: 16px;
            font-weight: 600;
        }
        
        .sidebar button {
            display: block;
            width: 100%;
            padding: 10px 14px;
            margin-bottom: 6px;
            background: rgba(255, 255, 255, 0.02);
            border: none;
            border-radius: 10px;
            color: rgba(255, 255, 255, 0.6);
            font-family: inherit;
            font-size: 14px;
            font-weight: 400;
            text-align: left;
            cursor: pointer;
            transition: background 0.2s ease, color 0.2s ease;
        }
        
        .sidebar button:hover {
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
        }
        
        .sidebar button.active {
            background: rgba(0, 122, 255, 0.12);
            color: #fff;
        }
        
        .sidebar button .badge {
            float: right;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.2);
        }
        
        .sidebar button.active .badge {
            color: #007aff;
        }

        .sidebar button.danger-confirm {
            background: rgba(255, 59, 48, 0.15) !important;
            color: #ff453a !important;
            font-weight: 500;
        }
        .sidebar button.danger-confirm .badge {
            color: #ff453a !important;
        }

        /* Expandable Config Wrapper (Apple Layout System) */
        .menu-section-container {
            background: rgba(255, 255, 255, 0.02);
            border-radius: 12px;
            margin-bottom: 6px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.02);
        }

        .menu-section-container button {
            margin-bottom: 0;
            background: transparent;
            border-radius: 0;
        }

        .expandable-panel {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s cubic-bezier(0.25, 1, 0.5, 1);
            background: rgba(0, 0, 0, 0.2);
            padding: 0 14px;
        }

        .expandable-panel.expanded {
            max-height: 260px; /* Gives room for customizable options */
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            padding: 12px 14px;
        }

        /* Customizable settings controls inside expanded panel */
        .control-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.6);
        }
        .control-row:last-child {
            margin-bottom: 2px;
        }

        /* Custom Selector Segments */
        .segment-container {
            display: flex;
            background: rgba(255, 255, 255, 0.06);
            padding: 2px;
            border-radius: 8px;
            width: 130px;
        }
        .segment-btn {
            flex: 1;
            padding: 4px 0 !important;
            font-size: 11px !important;
            text-align: center !important;
            border-radius: 6px !important;
            color: rgba(255, 255, 255, 0.4) !important;
        }
        .segment-btn.selected {
            background: rgba(255, 255, 255, 0.15) !important;
            color: #fff !important;
            font-weight: 500;
        }

        /* iOS-style range sliders and inputs */
        .apple-slider {
            -webkit-appearance: none;
            width: 90px;
            height: 4px;
            border-radius: 2px;
            background: rgba(255, 255, 255, 0.1);
            outline: none;
        }
        .apple-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #fff;
            cursor: pointer;
            box-shadow: 0 1px 4px rgba(0,0,0,0.4);
        }
        
        .apple-color {
            -webkit-appearance: none;
            border: none;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            cursor: pointer;
            background: transparent;
        }
        .apple-color::-webkit-color-swatch-wrapper {
            padding: 0;
        }
        .apple-color::-webkit-color-swatch {
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 50%;
        }

        /* ============================================================
           HAMBURGER (Clean, Minimal)
           ============================================================ */
        .hamburger {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 2100;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 12px;
            width: 40px;
            height: 40px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 4px;
            transition: 0.2s ease;
        }
        
        .hamburger:hover {
            background: rgba(255, 255, 255, 0.06);
        }
        
        .hamburger .bar {
            width: 18px;
            height: 1.5px;
            background: rgba(255, 255, 255, 0.7);
            border-radius: 2px;
            transition: 0.3s ease;
        }
        
        .hamburger.open .bar:nth-child(1) {
            transform: rotate(-45deg) translate(-4px, 4px);
        }
        .hamburger.open .bar:nth-child(2) {
            opacity: 0;
        }
        .hamburger.open .bar:nth-child(3) {
            transform: rotate(45deg) translate(-4px, -4px);
        }
        
        /* ============================================================
           ACTION BUTTON (Drop Waypoint - Pin Icon)
           ============================================================ */
        .action-btn {
            position: fixed;
            bottom: 40px;
            right: 24px;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 50%;
            width: 56px;
            height: 56px;
            color: #fff;
            font-size: 24px;
            cursor: grab;
            transition: 0.2s ease;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            touch-action: none;
        }
        
        .action-btn:hover {
            background: rgba(255, 255, 255, 0.12);
            transform: scale(1.04);
        }
        
        .action-btn:active {
            cursor: grabbing;
            transform: scale(0.92);
        }
        
        .action-btn .pin-icon {
            font-size: 28px;
            line-height: 1;
        }
        
        /* ============================================================
           MAP CONTROLS OVERRIDE
           ============================================================ */
        .leaflet-control-layers {
            background: rgba(0, 0, 0, 0.6) !important;
            backdrop-filter: blur(20px) !important;
            -webkit-backdrop-filter: blur(20px) !important;
            border: 1px solid rgba(255, 255, 255, 0.06) !important;
            border-radius: 12px !important;
            color: #fff !important;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif !important;
        }
        
        .leaflet-control-layers label {
            color: #fff !important;
            font-weight: 400 !important;
            font-size: 13px !important;
        }
        
        .leaflet-control-layers-selector {
            accent-color: #007aff !important;
        }
        
        .leaflet-popup-content-wrapper {
            background: rgba(0, 0, 0, 0.85) !important;
            backdrop-filter: blur(20px) !important;
            border: 1px solid rgba(255, 255, 255, 0.06) !important;
            border-radius: 12px !important;
            color: #fff !important;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif !important;
        }
        
        .leaflet-popup-tip {
            background: rgba(0, 0, 0, 0.85) !important;
        }
    </style>
</head>
<body>

    <button class="hamburger" id="menu-btn" onclick="toggleSidebar()">
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
    </button>

    <div class="sidebar" id="sidebar-panel">
        <div class="sidebar-title">Menu</div>
        
        <button class="active" id="opt-hud" onclick="toggleOption('hud')">
            <span>HUD Display</span>
            <span class="badge">●</span>
        </button>
        
        <button class="active" id="opt-trail" onclick="toggleOption('trail')">
            <span>Tracking Trail</span>
            <span class="badge">●</span>
        </button>

        <div class="menu-section-container">
            <button id="btn-style-menu" onclick="toggleStyleConfig()">
                <span>Marker Style</span>
                <span class="badge" id="style-badge">Pin ▾</span>
            </button>
            <div class="expandable-panel" id="style-config-panel">
                <div class="control-row">
                    <span>Type</span>
                    <div class="segment-container">
                        <div class="segment-btn selected" id="seg-pin" onclick="setMarkerStyle('pin')">Pin</div>
                        <div class="segment-btn" id="seg-circle" onclick="setMarkerStyle('circle')">Circle</div>
                    </div>
                </div>
                <div id="circle-customizers" style="display: none; transition: opacity 0.2s ease;">
                    <div class="control-row">
                        <span>Radius (m)</span>
                        <input type="range" class="apple-slider" id="cfg-radius" min="5" max="100" value="20" oninput="updateCircleConfigs()">
                    </div>
                    <div class="control-row">
                        <span>Color</span>
                        <input type="color" class="apple-color" id="cfg-color" value="#007aff" oninput="updateCircleConfigs()">
                    </div>
                    <div class="control-row">
                        <span>Opacity</span>
                        <input type="range" class="apple-slider" id="cfg-opacity" min="10" max="100" value="60" oninput="updateCircleConfigs()">
                    </div>
                </div>
            </div>
        </div>

        <button onclick="clearTrail()">
            <span>Clear Trail</span>
            <span class="badge">↺</span>
        </button>
        
        <button id="btn-clear-waypoints" onclick="clearWaypoints()">
            <span>Clear Waypoints</span>
            <span class="badge">✕</span>
        </button>
        
        <button onclick="centerMap()">
            <span>Center on Me</span>
            <span class="badge">⌖</span>
        </button>
    </div>

    <div class="hud" id="data-hud">
        <div class="hud-grid">
            <div class="hud-item">
                <span class="hud-label">Position</span>
                <span class="hud-value" id="coords">---</span>
            </div>
            <div class="hud-item">
                <span class="hud-label">Accuracy</span>
                <span class="hud-value"><span class="dim" id="accuracy">---</span></span>
            </div>
            <div class="hud-item">
                <span class="hud-label">Heading</span>
                <span class="hud-value" id="bearing">---</span>
            </div>
        </div>
    </div>

    <div id="map"></div>

    <div class="magnifying-glass" id="magnifying-glass">
        <div class="zoom-content" id="zoom-content"></div>
        <div class="crosshair"></div>
    </div>

    <button class="action-btn" id="drop-btn" title="Drag to drop waypoint">
        <span class="pin-icon">📍</span>
    </button>

    <script>
        // ============================================================
        // GLOBAL SCOPE DELETION ENGINE
        // ============================================================
        window.deleteWaypoint = function(id) {
            const idx = waypoints.findIndex(w => w.id === id);
            if (idx !== -1) {
                map.removeLayer(waypoints[idx].layerInstance);
                waypoints.splice(idx, 1);
                saveWaypoints();
            }
        };

        // ============================================================
        // MAP ENGINE SETUP
        // ============================================================
        const streetLayer = L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
            attribution: '© CARTO',
            maxZoom: 20
        });

        const satelliteLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            attribution: '© Esri',
            maxZoom: 19
        });

        const map = L.map('map', {
            zoomControl: false,
            center: [0, 0],
            zoom: 2,
            preferCanvas: true,
            layers: [streetLayer]
        });

        L.control.layers(
            { "🗺️ Street": streetLayer, "🛰️ Satellite": satelliteLayer },
            null,
            { position: 'topright' }
        ).addTo(map);

        // ============================================================
        // APP CONFIGURATIONS & COMPONENT STATES
        // ============================================================
        let userMarker = null;
        let accuracyCircle = null;
        let isFirstLocation = true;
        let currentHeading = 0;
        let lastHeadingApplied = -1;

        let showHUD = true;
        let showTrail = true;
        let clearWaypointsTimeout = null;

        // Waypoint Marker State Preferences
        let markerType = 'pin'; // 'pin' or 'circle'
        let circleConfig = {
            radius: 20,
            color: '#007aff',
            opacity: 0.6
        };

        let trailPoints = [];
        const trailLine = L.polyline([], {
            color: '#007aff',
            weight: 2.5,
            opacity: 0.4,
            smoothFactor: 1.5
        }).addTo(map);

        let waypoints = [];

        const coordsEl = document.getElementById('coords');
        const accuracyEl = document.getElementById('accuracy');
        const bearingEl = document.getElementById('bearing');
        const hudEl = document.getElementById('data-hud');
        const magGlass = document.getElementById('magnifying-glass');
        const zoomContent = document.getElementById('zoom-content');

        // ============================================================
        // RE-ARCHITECTED WAYPOINT RENDER ENGINE
        // ============================================================
        function createWaypoint(id, lat, lng) {
            if (waypoints.some(w => w.id === id)) return;

            let layerInstance;

            if (markerType === 'pin') {
                const icon = L.divIcon({
                    html: `<div class="waypoint-pin">📍</div>`,
                    iconSize: [36, 36],
                    iconAnchor: [18, 36],
                    className: ''
                });
                layerInstance = L.marker([lat, lng], { icon }).addTo(map);
            } else {
                layerInstance = L.circle([lat, lng], {
                    radius: circleConfig.radius,
                    color: circleConfig.color,
                    fillColor: circleConfig.color,
                    fillOpacity: circleConfig.opacity,
                    weight: 2
                }).addTo(map);
            }

            layerInstance.bindPopup(`
                <div style="font-family: -apple-system, sans-serif; text-align: center; padding: 4px 0;">
                    <div style="font-weight: 600; font-size: 14px; margin-bottom: 6px;">📍 Waypoint</div>
                    <div style="font-size: 11px; color: rgba(255,255,255,0.5); margin-bottom: 8px;">
                        ${lat.toFixed(5)}, ${lng.toFixed(5)}
                    </div>
                    <button onclick="window.deleteWaypoint('${id}')" 
                        style="background: #ff3b30; color: #fff; border: none; padding: 6px 16px; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 500;">
                        Delete
                    </button>
                </div>
            `);

            waypoints.push({ id, lat, lng, layerInstance });
            saveWaypoints();
        }

        // Swaps running visual architecture inside live layers seamlessly
        function redrawAllWaypoints() {
            waypoints.forEach(w => {
                map.removeLayer(w.layerInstance);
                
                if (markerType === 'pin') {
                    const icon = L.divIcon({
                        html: `<div class="waypoint-pin">📍</div>`,
                        iconSize: [36, 36],
                        iconAnchor: [18, 36],
                        className: ''
                    });
                    w.layerInstance = L.marker([w.lat, w.lng], { icon }).addTo(map);
                } else {
                    w.layerInstance = L.circle([w.lat, w.lng], {
                        radius: circleConfig.radius,
                        color: circleConfig.color,
                        fillColor: circleConfig.color,
                        fillOpacity: circleConfig.opacity,
                        weight: 2
                    }).addTo(map);
                }

                w.layerInstance.bindPopup(`
                    <div style="font-family: -apple-system, sans-serif; text-align: center; padding: 4px 0;">
                        <div style="font-weight: 600; font-size: 14px; margin-bottom: 6px;">📍 Waypoint</div>
                        <div style="font-size: 11px; color: rgba(255,255,255,0.5); margin-bottom: 8px;">
                            ${w.lat.toFixed(5)}, ${w.lng.toFixed(5)}
                        </div>
                        <button onclick="window.deleteWaypoint('${w.id}')" 
                            style="background: #ff3b30; color: #fff; border: none; padding: 6px 16px; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 500;">
                            Delete
                        </button>
                    </div>
                `);
            });
        }

        function saveWaypoints() {
            const data = waypoints.map(w => ({ id: w.id, lat: w.lat, lng: w.lng }));
            localStorage.setItem('rulost_waypoints', JSON.stringify(data));
        }

        function loadWaypoints() {
            try {
                const data = JSON.parse(localStorage.getItem('rulost_waypoints')) || [];
                data.forEach(w => createWaypoint(w.id, w.lat, w.lng));
            } catch(e) {
                console.error(e);
            }
        }

        // ============================================================
        // CUSTOMIZATION PRESETS ENGINE
        // ============================================================
        function toggleStyleConfig() {
            const panel = document.getElementById('style-config-panel');
            panel.classList.toggle('expanded');
        }

        function setMarkerStyle(style) {
            markerType = style;
            document.getElementById('seg-pin').classList.toggle('selected', style === 'pin');
            document.getElementById('seg-circle').classList.toggle('selected', style === 'circle');
            
            const customizers = document.getElementById('circle-customizers');
            customizers.style.display = style === 'circle' ? 'block' : 'none';
            
            document.getElementById('style-badge').textContent = (style === 'pin' ? 'Pin ▾' : 'Circle ▾');
            redrawAllWaypoints();
        }

        function updateCircleConfigs() {
            circleConfig.radius = parseInt(document.getElementById('cfg-radius').value, 10);
            circleConfig.color = document.getElementById('cfg-color').value;
            circleConfig.opacity = parseFloat(document.getElementById('cfg-opacity').value) / 100;
            
            if (markerType === 'circle') {
                waypoints.forEach(w => {
                    if(w.layerInstance.setRadius) {
                        w.layerInstance.setRadius(circleConfig.radius);
                        w.layerInstance.setStyle({
                            color: circleConfig.color,
                            fillColor: circleConfig.color,
                            fillOpacity: circleConfig.opacity
                        });
                    }
                });
            }
        }

        // ============================================================
        // TRACKING & GEOLOCATION LOOPS
        // ============================================================
        function updateLocation(lat, lng, accuracy = null) {
            coordsEl.textContent = `${lat.toFixed(5)}, ${lng.toFixed(5)}`;
            accuracyEl.textContent = accuracy ? `±${Math.round(accuracy)}m` : '---';

            if (trailPoints.length === 0 || L.latLng(trailPoints[trailPoints.length - 1]).distanceTo([lat, lng]) > 5) {
                trailPoints.push([lat, lng]);
                if (showTrail) trailLine.setLatLngs(trailPoints);
            }

            if (!accuracyCircle) {
                accuracyCircle = L.circle([lat, lng], {
                    radius: accuracy || 20,
                    color: '#007aff',
                    fillColor: '#007aff',
                    fillOpacity: 0.06,
                    weight: 1
                }).addTo(map);
            } else {
                accuracyCircle.setLatLng([lat, lng]);
                if (accuracy) accuracyCircle.setRadius(accuracy);
            }

            if (!userMarker) {
                const icon = L.divIcon({
                    className: 'user-marker-container',
                    html: `<div class="user-marker" id="arrow-element"><div class="user-arrow"></div></div>`,
                    iconSize: [28, 28],
                    iconAnchor: [14, 14]
                });
                userMarker = L.marker([lat, lng], { icon }).addTo(map);
            } else {
                userMarker.setLatLng([lat, lng]);
            }

            applyRotation();

            if (isFirstLocation) {
                map.setView([lat, lng], 17);
                isFirstLocation = false;
            }
        }

        function applyRotation() {
            if (currentHeading === lastHeadingApplied) return;
            lastHeadingApplied = currentHeading;

            const dirs = ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'];
            const idx = Math.round(((currentHeading % 360) / 45)) % 8;
            bearingEl.textContent = `${String(currentHeading).padStart(3, '0')}° ${dirs[idx]}`;

            const arrow = document.getElementById('arrow-element');
            if (arrow) {
                arrow.style.transform = `rotate(${currentHeading}deg)`;
            }
        }

        function handleOrientation(e) {
            let heading = e.webkitCompassHeading ?? (e.alpha !== null ? 360 - e.alpha : null);
            if (heading !== null && heading !== undefined) {
                currentHeading = Math.round(heading);
                applyRotation();
            }
        }

        if (window.DeviceOrientationEvent) {
            if (typeof DeviceOrientationEvent.requestPermission === 'function') {
                document.addEventListener('click', function initCompass() {
                    DeviceOrientationEvent.requestPermission().then(r => {
                        if (r === 'granted') {
                            window.addEventListener('deviceorientation', handleOrientation);
                        }
                    });
                    document.removeEventListener('click', initCompass);
                });
            } else {
                window.addEventListener('deviceorientation', handleOrientation);
            }
        }

        // ============================================================
        // INTERACTIVE TOUCH/MOUSE DRAG SYSTEM
        // ============================================================
        map.on('contextmenu', function(e) {
            const id = Date.now().toString();
            createWaypoint(id, e.latlng.lat, e.latlng.lng);
        });

        const dropBtn = document.getElementById('drop-btn');
        let isDragging = false;
        let offsetX = 0, offsetY = 0;

        function updateMagnifyingGlass(clientX, clientY) {
            const mapContainer = map.getContainer();
            const rect = mapContainer.getBoundingClientRect();
            const x = clientX - rect.left;
            const y = clientY - rect.top;

            if (x >= 0 && x <= rect.width && y >= 0 && y <= rect.height) {
                magGlass.style.display = 'block';
                magGlass.style.left = clientX + 'px';
                magGlass.style.top = (clientY - 60) + 'px';

                const latlng = map.containerPointToLatLng([x, y]);
                const zoomedCenter = map.project(latlng, map.getZoom() + 2);
                const tileSize = 256;
                const scale = 2;
                const baseUrl = 'https://a.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}.png';
                const url = baseUrl
                    .replace('{z}', map.getZoom() + 2)
                    .replace('{x}', Math.floor(zoomedCenter.x / tileSize))
                    .replace('{y}', Math.floor(zoomedCenter.y / tileSize));
                zoomContent.style.backgroundImage = `url('${url}')`;
                zoomContent.style.backgroundSize = `${tileSize * scale}px ${tileSize * scale}px`;
                zoomContent.style.backgroundPosition = `-${(zoomedCenter.x % tileSize) * scale}px -${(zoomedCenter.y % tileSize) * scale}px`;
            } else {
                magGlass.style.display = 'none';
            }
        }

        // Mobile Handlers
        dropBtn.addEventListener('touchstart', function(e) {
            const touch = e.touches[0];
            const rect = dropBtn.getBoundingClientRect();
            offsetX = touch.clientX - rect.left;
            offsetY = touch.clientY - rect.top;
            isDragging = true;
            dropBtn.style.opacity = '0.6';
        }, { passive: true });

        document.addEventListener('touchmove', function(e) {
            if (!isDragging) return;
            e.preventDefault();
            const touch = e.touches[0];
            dropBtn.style.position = 'fixed';
            dropBtn.style.left = (touch.clientX - offsetX) + 'px';
            dropBtn.style.top = (touch.clientY - offsetY) + 'px';
            dropBtn.style.bottom = 'auto';
            dropBtn.style.right = 'auto';
            updateMagnifyingGlass(touch.clientX, touch.clientY);
        }, { passive: false });

        document.addEventListener('touchend', function(e) {
            if (!isDragging) return;
            isDragging = false;
            dropBtn.style.opacity = '1';
            magGlass.style.display = 'none';

            const touch = e.changedTouches[0];
            const mapContainer = map.getContainer();
            const rect = mapContainer.getBoundingClientRect();
            const x = touch.clientX - rect.left;
            const y = touch.clientY - rect.top;

            if (x >= 0 && x <= rect.width && y >= 0 && y <= rect.height) {
                const latlng = map.containerPointToLatLng([x, y]);
                const id = Date.now().toString();
                createWaypoint(id, latlng.lat, latlng.lng);
            }

            dropBtn.style.left = '';
            dropBtn.style.top = '';
            dropBtn.style.position = 'fixed';
            dropBtn.style.bottom = '40px';
            dropBtn.style.right = '24px';
        }, { passive: true });

        // Desktop Handlers
        dropBtn.addEventListener('mousedown', function(e) {
            const rect = dropBtn.getBoundingClientRect();
            offsetX = e.clientX - rect.left;
            offsetY = e.clientY - rect.top;
            isDragging = true;
            dropBtn.style.cursor = 'grabbing';
            dropBtn.style.opacity = '0.6';
        });

        document.addEventListener('mousemove', function(e) {
            if (!isDragging) return;
            dropBtn.style.position = 'fixed';
            dropBtn.style.left = (e.clientX - offsetX) + 'px';
            dropBtn.style.top = (e.clientY - offsetY) + 'px';
            dropBtn.style.bottom = 'auto';
            dropBtn.style.right = 'auto';
            updateMagnifyingGlass(e.clientX, e.clientY);
        });

        document.addEventListener('mouseup', function(e) {
            if (!isDragging) return;
            isDragging = false;
            dropBtn.style.cursor = 'grab';
            dropBtn.style.opacity = '1';
            magGlass.style.display = 'none';

            const mapContainer = map.getContainer();
            const rect = mapContainer.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            if (x >= 0 && x <= rect.width && y >= 0 && y <= rect.height) {
                const latlng = map.containerPointToLatLng([x, y]);
                const id = Date.now().toString();
                createWaypoint(id, latlng.lat, latlng.lng);
            }

            dropBtn.style.left = '';
            dropBtn.style.top = '';
            dropBtn.style.position = 'fixed';
            dropBtn.style.bottom = '40px';
            dropBtn.style.right = '24px';
        });

        // Bootstrap Map
        loadWaypoints();

        if (navigator.geolocation) {
            navigator.geolocation.watchPosition(
                pos => updateLocation(pos.coords.latitude, pos.coords.longitude, pos.coords.accuracy),
                err => { coordsEl.textContent = 'No GPS'; },
                { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
            );
        } else {
            coordsEl.textContent = 'No GPS';
        }

        // ============================================================
        // MENU PANEL CORE ACTIONS
        // ============================================================
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar-panel');
            const trigger = document.getElementById('menu-btn');
            sidebar.classList.toggle('open');
            trigger.classList.toggle('open');
        }

        function toggleOption(type) {
            const btn = document.getElementById(`opt-${type}`);
            if (type === 'hud') {
                showHUD = !showHUD;
                hudEl.style.opacity = showHUD ? '1' : '0';
                btn.classList.toggle('active', showHUD);
            } else if (type === 'trail') {
                showTrail = !showTrail;
                if (showTrail) {
                    trailLine.setLatLngs(trailPoints);
                } else {
                    trailLine.setLatLngs([]);
                }
                btn.classList.toggle('active', showTrail);
            }
        }

        function clearTrail() {
            trailPoints = [];
            trailLine.setLatLngs([]);
        }

        function clearWaypoints() {
            const btn = document.getElementById('btn-clear-waypoints');
            if (btn.classList.contains('danger-confirm')) {
                clearTimeout(clearWaypointsTimeout);
                waypoints.forEach(w => map.removeLayer(w.layerInstance));
                waypoints = [];
                saveWaypoints();
                
                btn.classList.remove('danger-confirm');
                btn.querySelector('span:first-child').textContent = 'Clear Waypoints';
                btn.querySelector('.badge').textContent = '✕';
            } else {
                btn.classList.add('danger-confirm');
                btn.querySelector('span:first-child').textContent = 'Are you sure?';
                btn.querySelector('.badge').textContent = '●';
                
                clearWaypointsTimeout = setTimeout(() => {
                    btn.classList.remove('danger-confirm');
                    btn.querySelector('span:first-child').textContent = 'Clear Waypoints';
                    btn.querySelector('.badge').textContent = '✕';
                }, 3000);
            }
        }

        function centerMap() {
            if (userMarker) {
                const pos = userMarker.getLatLng();
                map.setView([pos.lat, pos.lng], 17);
            }
        }

        // Attach layout actions to Global space
        window.toggleSidebar = toggleSidebar;
        window.toggleOption = toggleOption;
        window.clearTrail = clearTrail;
        window.clearWaypoints = clearWaypoints;
        window.centerMap = centerMap;
        window.toggleStyleConfig = toggleStyleConfig;
        window.setMarkerStyle = setMarkerStyle;
        window.updateCircleConfigs = updateCircleConfigs;
    </script>
</body>
</html>
