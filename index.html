<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rulost</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #ffffff;
            overflow: hidden;
            height: 100vh;
            color: #000;
        }
        
        #map {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
            background: #ffffff !important;
            pointer-events: auto !important;
        }

        .leaflet-tile-container canvas { pointer-events: none !important; }
        
        /* HUD & UI - Light Theme */
        .hud {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 999;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 0, 0, 0.1);
            border-radius: 16px;
            padding: 10px 20px;
            width: 90%;
            max-width: 360px;
            pointer-events: none;
            color: #000;
        }

        .hamburger {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 2100;
            background: #fff;
            border: 1px solid rgba(0,0,0,0.1);
            border-radius: 12px;
            width: 40px;
            height: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 4px;
            cursor: pointer;
        }
        
        .bar { width: 18px; height: 2px; background-color: #000; }
        
        .sidebar-wrapper {
            position: fixed;
            top: 0;
            left: -300px;
            width: 280px;
            height: 100vh;
            background: #ffffff;
            border-right: 1px solid rgba(0,0,0,0.1);
            z-index: 2000;
            transition: 0.3s;
            padding: 60px 20px;
        }
        .sidebar-wrapper.open { left: 0; }
    </style>
</head>
<body>

    <button class="hamburger" onclick="document.getElementById('sidebar').classList.toggle('open')">
        <div class="bar"></div><div class="bar"></div><div class="bar"></div>
    </button>

    <div class="sidebar-wrapper" id="sidebar">
        <h3>Menu</h3>
        <button onclick="map.setView([11.56, 104.91], 16)">Center on Me</button>
    </div>

    <div class="hud">
        <div style="display:flex; justify-content: space-around;">
            <div>Pos: <span id="coords">---</span></div>
            <div>Acc: <span id="acc">---</span></div>
        </div>
    </div>

    <div id="map"></div>

    <script>
        // Grid Layer (Black lines on white background)
        const pureGridLayer = L.gridLayer({ tileSize: 256 });
        pureGridLayer.createTile = function() {
            const t = document.createElement('canvas');
            t.width = 256; t.height = 256;
            const ctx = t.getContext('2d');
            ctx.strokeStyle = '#cccccc'; 
            ctx.strokeRect(0, 0, 256, 256);
            ctx.fillStyle = '#000';
            ctx.fillRect(126, 126, 4, 4);
            return t;
        };

        const map = L.map('map', { 
            center: [11.56494, 104.91438], 
            zoom: 16, 
            layers: [pureGridLayer] 
        });

        // Initialize GPS
        if (navigator.geolocation) {
            navigator.geolocation.watchPosition(pos => {
                document.getElementById('coords').textContent = pos.coords.latitude.toFixed(3);
                document.getElementById('acc').textContent = Math.round(pos.coords.accuracy) + 'm';
            });
        }
    </script>
</body>
</html>
