<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rulost</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <style>
        /* Force Light Theme */
        html, body, #map {
            background: #ffffff !important;
            margin: 0;
            padding: 0;
            color: #000;
        }

        /* Essential: Fix Leaflet's default grey map background */
        .leaflet-container {
            background: #ffffff !important;
        }

        /* HUD - Updated for Light Mode */
        .hud {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 999;
            background: rgba(255, 255, 255, 0.9) !important;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 0, 0, 0.15) !important;
            border-radius: 16px;
            padding: 10px 20px;
            width: 90%;
            max-width: 360px;
            pointer-events: none;
            color: #000 !important;
        }
        
        .hud-label { color: rgba(0, 0, 0, 0.4) !important; }
        .hud-value { color: #000 !important; }

        /* Sidebar - Light Theme */
        .sidebar-wrapper {
            background: #ffffff !important;
            border-right: 1px solid rgba(0, 0, 0, 0.1);
            color: #000 !important;
        }

        .hamburger {
            background: rgba(255, 255, 255, 0.9) !important;
            border: 1px solid rgba(0, 0, 0, 0.1) !important;
        }
        .bar { background-color: #000 !important; }

        /* Leaflet Elements - Adjust to visible colors */
        .leaflet-control-layers {
            background: #fff !important;
            color: #000 !important;
            border: 1px solid #ccc !important;
        }
    </style>
</head>
<body>

    <button class="hamburger" id="menu-btn" onclick="toggleSidebar();">
        <div class="bar"></div><div class="bar"></div><div class="bar"></div>
    </button>

    <div class="sidebar-wrapper" id="sidebar">
        <h3>Menu</h3>
        <button onclick="map.setView([11.56494, 104.91438], 16)">Reset View</button>
    </div>

    <div class="hud" id="data-hud">
        <div style="display:flex; justify-content: space-between; text-align: center;">
            <div><div class="hud-label">Pos</div><div class="hud-value" id="coords">---</div></div>
            <div><div class="hud-label">Acc</div><div class="hud-value" id="acc">---</div></div>
        </div>
    </div>

    <div id="map"></div>

    <script>
        // Grid Layer: Black lines on White background
        const pureGridLayer = L.gridLayer({ tileSize: 256, opacity: 1, interactive: false });
        pureGridLayer.createTile = function() {
            const t = document.createElement('canvas');
            t.width = 256; t.height = 256;
            const ctx = t.getContext('2d');
            ctx.strokeStyle = 'rgba(0, 0, 0, 0.15)'; 
            ctx.strokeRect(0, 0, 256, 256);
            ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
            ctx.fillRect(126, 126, 4, 4);
            return t;
        };

        const map = L.map('map', { 
            center: [11.56494, 104.91438], 
            zoom: 16, 
            layers: [pureGridLayer] 
        });

        // Toggle Sidebar
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
        }

        // Simple GPS
        if (navigator.geolocation) {
            navigator.geolocation.watchPosition(pos => {
                document.getElementById('coords').textContent = pos.coords.latitude.toFixed(3) + ", " + pos.coords.longitude.toFixed(3);
                document.getElementById('acc').textContent = Math.round(pos.coords.accuracy) + 'm';
            });
        }
    </script>
</body>
</html>
